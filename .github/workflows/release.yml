# Build, package and attest swift_tar for six targets. This workflow does NOT create the release.
# 為六個目標建置、打包並簽署來源證明 swift_tar。本 workflow **不**建立 release。
#
# Targets / 目標: linux-{x86_64,aarch64}-musl (static, needs nothing), macos-{x86_64,arm64},
# windows-{x86_64,arm64} (the Swift runtime DLLs ride along). All are the public build: no LZFSE.
# Linux ships musl only (user's decision, 2026-11-04): a glibc build needs a glibc at least as
# new as its build machine's. The Linux name is multissh's.
# linux-{x86_64,aarch64}-musl（靜態，什麼都不需要），macos-{x86_64,arm64}，
# windows-{x86_64,arm64}（Swift runtime DLL 隨附）。全部都是公開版：不含 LZFSE。Linux 只出 musl 版
# （使用者 2026-11-04 決定）：glibc 建置需要不比建置機器舊的 glibc。Linux 的命名與 multissh 相同。
#
# The verify job then runs each Linux archive on its own in a plain ubuntu image with no Swift,
# through verify_release.zsh.
# verify job 接著把每份 Linux 封存單獨放進沒有 Swift 的一般 ubuntu 映像，以 verify_release.zsh 執行。
#
# Each job builds with this repository's own scripts and packs with release.zsh, which runs
# the extracted binary, round-trips a .tar.gz and checks LZFSE is refused before it writes the
# .sha256, and uploads the archive as an artifact. For a pushed tag v<X.Y.Z> GitHub also signs a
# build-provenance attestation for each archive:
#   gh attestation verify swift_tar-<X.Y.Z>-<platform>.tar.zst -R raliclo/swift_tar
# The release itself is created by publish.zsh with the maintainer's own gh login, from these
# artifacts, so GitHub shows the maintainer, not github-actions, as the one who released it (the
# user's decision, 2026-11-04, as for lzfse). Hence no contents: write here.
# 每個 job 以本 repo 自己的腳本建置，再以 release.zsh 打包；release.zsh 會先執行解開後的執行檔、
# 完成一次 .tar.gz 往返並確認 LZFSE 被拒絕，才寫出 .sha256，接著把封存上傳成 artifact。推送 tag
# v<X.Y.Z> 時，GitHub 另外為每份封存簽署建置來源證明（attestation）：
#   gh attestation verify swift_tar-<X.Y.Z>-<platform>.tar.zst -R raliclo/swift_tar
# release 本身由 publish.zsh 以維護者自己的 gh 登入、從這些 artifact 建立，GitHub 才會顯示是維護者發布
# 的，而不是 github-actions（使用者 2026-11-04 決定，與 lzfse 相同）。因此這裡不需要 contents: write。
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFT_VERSION: "6.4.2"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    # id-token and attestations are for the build-provenance attestation of a tag's archives.
    # id-token 與 attestations 給 tag 封存的建置來源證明用。
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64-musl,  runner: ubuntu-24.04,     container: "swift:6.4.2-noble", compile_args: "--musl" }
          - { platform: linux-aarch64-musl, runner: ubuntu-24.04-arm, container: "swift:6.4.2-noble", compile_args: "--musl" }
          - { platform: macos-x86_64,       runner: macos-15-intel }
          - { platform: macos-arm64,        runner: macos-15 }
          - { platform: windows-x86_64,     runner: windows-2025,     swift_arch: amd64 }
          - { platform: windows-arm64,      runner: windows-11-arm,   swift_arch: arm64 }
    steps:
      # The swift image has clang but no cc, make, zsh or cmake; file is for release.zsh's
      # static check of the musl build. / swift 映像有 clang，但沒有 cc、make、zsh 與 cmake；file 給
      # release.zsh 檢查 musl 版是否為靜態。
      - name: Tools (Linux) / 工具（Linux）
        if: runner.os == 'Linux'
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git zsh cmake make binutils zstd file libbz2-dev
          echo CC=clang >> "$GITHUB_ENV"
          echo CXX=clang++ >> "$GITHUB_ENV"

      # Only the -musl jobs need Swift's Static Linux SDK, matching swiftc exactly (checksum from
      # swift.org, as in multissh's CI). / 只有 -musl 的 job 需要 Swift Static Linux SDK，必須與 swiftc
      # 完全相符（checksum 取自 swift.org，與 multissh 的 CI 相同）。
      - name: Static Linux SDK (musl) / Static Linux SDK（musl）
        if: matrix.compile_args == '--musl'
        run: |
          swift sdk install \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/static-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum 3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a
          sdk=$(find / -type d -name swift-linux-musl -path "*swift-${SWIFT_VERSION}-RELEASE_static-linux*" 2>/dev/null | head -1)
          [ -n "$sdk" ] || { echo "installed SDK not found / 找不到已安裝的 SDK"; exit 1; }
          echo "SWIFT_STATIC_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Tools (macOS) / 工具（macOS）
        if: runner.os == 'macOS'
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v zstd >/dev/null || brew install zstd
          swiftc --version

      # build_arch must name the runner's architecture: the default (amd64) installed the x64
      # toolchain on windows-11-arm, whose swift crashed (multissh's CI, run 3).
      # build_arch 必須是 runner 的架構：預設值（amd64）在 windows-11-arm 上裝成 x64 工具鏈，而它的
      # swift 會崩潰（multissh 的 CI 第 3 次執行）。
      - name: Swift (Windows) / Swift（Windows）
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@main
        # swift-version and swift-build replace branch and tag, which the action deprecated; giving an
        # old and a new one together is an error there. Same change as lzfse2's 8d10c9b, whose run passed.
        # swift-version 與 swift-build 取代已被 action 棄用的 branch 與 tag；新舊同時給在那邊會被當成錯誤。
        # 與 lzfse2 的 8d10c9b 相同，該次 CI 通過。
        with:
          build_arch: ${{ matrix.swift_arch }}
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE

      - name: zsh (Windows) / zsh（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: zsh zstd

      # LF on Windows too: a CRLF checkout breaks every zsh script.
      # --system, not --global: the build runs in the msys2 shell, whose HOME is not the Windows
      # one, so a --global setting never reached it and Git for Windows' own autocrlf=true applied.
      # git apply then wrote patch 0004's file back as CRLF, and release.zsh refused the "modified"
      # libarchive/ (run 43402267112: i/lf w/crlf, core.autocrlf true from etc/gitconfig).
      # Windows 上也用 LF：CRLF 的 checkout 會讓每個 zsh 腳本壞掉。
      # 用 --system 而非 --global：建置跑在 msys2 shell 裡，它的 HOME 不是 Windows 的那個，所以
      # --global 的設定到不了那裡，Git for Windows 自己的 autocrlf=true 於是生效。git apply 因而把
      # patch 0004 的檔案寫回成 CRLF，release.zsh 拒絕了「被修改過」的 libarchive/
      # （run 43402267112：i/lf w/crlf，core.autocrlf true 來自 etc/gitconfig）。
      - name: LF line endings / LF 換行
        if: runner.os == 'Windows'
        shell: bash
        run: git config --system core.autocrlf false

      # Full history and tags: the build id is `git describe`, and at the tag it reads v<X.Y.Z>.
      # 完整歷史與 tag：build id 取自 `git describe`，在 tag 上它是 v<X.Y.Z>。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      # The public submodules the build needs; lzfse2 is private and the public build leaves it out.
      # Full history, not --depth 1: version.txt records each one's `git describe --tags`, and
      # without its tags that was a bare short hash (zlib_version=da607da for v1.3.2, 2026-11-04).
      # 建置需要的公開子模組；lzfse2 是 private，公開版不需要它。取完整歷史而非 --depth 1：version.txt
      # 記的是各自的 `git describe --tags`，沒有 tag 時只剩短 hash（2026-11-04 的 zlib_version=da607da，
      # 實為 v1.3.2）。
      - name: Submodules / 子模組
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init libarchive zlib zstd lz4 xz

      - name: Build and package / 建置與打包
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXCLUDE_LZFSE: "1"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            zsh ./compile_tar.zsh --no-lzfse
          else
            zsh ./compile_tar-linux.zsh ${{ matrix.compile_args }}
          fi
          zsh ./release.zsh

      # llvm-objdump (for release.zsh's PE reading) is in C:\Program Files\LLVM\bin on the runner.
      # llvm-objdump（release.zsh 讀 PE 用）在 runner 的 C:\Program Files\LLVM\bin。
      - name: Build and package (Windows) / 建置與打包（Windows）
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          EXCLUDE_LZFSE: "1"
        run: |
          export PATH="$PATH:/c/Program Files/LLVM/bin"
          zsh ./build_zlib-win.zsh
          zsh ./build_zstd-win.zsh
          zsh ./compile_tar-win.zsh
          zsh ./release.zsh

      # The name release.zsh gave the archive must be this job's platform; a mismatch would
      # upload one platform under another's name.
      # release.zsh 給封存的名字必須就是這個 job 的平台；不一致會把一個平台以另一個的名字上傳。
      - name: Check platform / 檢查平台
        shell: bash
        run: |
          ls -l dist/
          ls dist/swift_tar-*-${{ matrix.platform }}.tar.zst dist/swift_tar-*-${{ matrix.platform }}.tar.zst.sha256
          [ "$(ls dist/*.tar.zst | wc -l)" -eq 1 ] || { echo "expected exactly one archive / 預期恰好一份封存"; exit 1; }

      # On Linux, the release tooling's own tests against the binary just built (they include
      # the refusal of a glibc build and of a version file that names no libc).
      # 在 Linux 上，以剛建好的執行檔跑出貨工具自己的測試（包括拒絕 glibc 建置，以及拒絕沒寫明 libc 的
      # version 檔）。
      - name: test_release (Linux)
        if: runner.os == 'Linux'
        run: zsh ./test/test_release.zsh

      # For a tag only: what publish.zsh will put on the release is attested where it was built.
      # 只在 tag 時：publish.zsh 將放上 release 的東西，在它被建出的地方簽署來源證明。
      - name: Attest build provenance / 簽署建置來源證明
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.zst

      - uses: actions/upload-artifact@v6
        with:
          name: swift_tar-${{ matrix.platform }}
          path: |
            dist/*.tar.zst
            dist/*.tar.zst.sha256
          if-no-files-found: error

  # Each Linux archive alone, in ubuntu:24.04 with no Swift installed: the static build must run
  # on nothing at all.
  # 每份 Linux 封存單獨放進沒有安裝 Swift 的 ubuntu:24.04：靜態版必須什麼都不靠就能執行。
  verify:
    name: verify ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    container: "ubuntu:24.04"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64-musl,   runner: ubuntu-24.04 }
          - { platform: linux-aarch64-musl,  runner: ubuntu-24.04-arm }
    steps:
      - name: Tools / 工具
        run: |
          apt-get update -q
          # tar is GNU tar, which -test compares with; it cannot do ZIP, so -test falls back to
          # Info-ZIP's zip and unzip, and the codec tools are for the compressed cases.
          # tar 是 GNU tar，-test 拿它來比對；它做不了 ZIP，所以 -test 改用 Info-ZIP 的 zip 與 unzip，
          # codec 工具給壓縮的案例用。
          apt-get install -y -q --no-install-recommends zsh zstd binutils tar gzip bzip2 xz-utils lz4 zip unzip
          if ls -d /usr/lib/swift /usr/share/swift 2>/dev/null; then echo "a Swift is installed here / 這裡裝了 Swift"; exit 1; fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: verify_release.zsh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: swift_tar-${{ matrix.platform }}
          path: dist

      - name: verify_release.zsh
        run: |
          for a in dist/swift_tar-*-${{ matrix.platform }}.tar.zst; do zsh ./verify_release.zsh "$a"; done
